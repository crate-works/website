pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm run lint:biome
    - name: knip
      run: pnpm run lint:knip
    - name: typecheck
      run: pnpm run lint:types
    - name: astro
      run: pnpm run lint:astro

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
